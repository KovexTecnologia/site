<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem de prévia · Kovex</title>
<!--
  Fonte da imagem de compartilhamento (app/opengraph-image.png e app/twitter-image.png).
  Para regenerar: renderizar este arquivo em 1200x630 e salvar o PNG nesses dois caminhos.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Semi+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #0A121D; overflow: hidden; }
  body { position: relative; font-family: "Barlow", "Bahnschrift", system-ui, sans-serif; color: #F8FAFC; -webkit-font-smoothing: antialiased; }

  .logo { position: absolute; left: 72px; top: 64px; height: 36px; }
  h1 { position: absolute; left: 72px; top: 150px; width: 660px; font-family: "Barlow Semi Condensed", "Bahnschrift", sans-serif; font-weight: 700; font-size: 88px; line-height: 0.95; letter-spacing: -0.01em; }
  .rodape { position: absolute; left: 72px; bottom: 64px; display: flex; align-items: center; gap: 16px; font-size: 26px; color: #A7B1C2; }
  .rodape b { color: #7AA0F5; font-weight: 600; }
  .chevron { width: 12px; height: 15px; background: #7AA0F5; clip-path: polygon(0 0, 60% 0, 100% 50%, 60% 100%, 0 100%, 46.5% 50%); }

  /* o mesmo vidro do site, com as camadas fechadas formando o K */
  .vidro { position: absolute; right: 120px; top: 110px; width: 300px; aspect-ratio: 104.75 / 130; perspective: 1600px; --g: 12px; }
  .vidro::before { content: ""; position: absolute; inset: -55%; background: radial-gradient(closest-side, rgb(62 112 228 / 0.38), rgb(62 112 228 / 0)); }
  .pilha { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(-30deg) rotateX(8deg); }
  .placa { position: absolute; inset: 0; transform: translateZ(calc(var(--i) * var(--g) * -1)); opacity: calc(1 - var(--i) * 0.16); }
  .placa svg { width: 100%; height: 100%; overflow: visible; }
  .corpo { fill: url(#vidro-corpo); stroke: rgb(190 210 255 / 0.85); stroke-width: 0.7; }
  .reflexo { fill: url(#vidro-reflexo); }
  .barra .corpo { fill: url(#vidro-barra); stroke: rgb(248 250 252 / 0.9); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="vidro-corpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C88EE" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#3E70E4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2247D2" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="vidro-reflexo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset=".35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vidro-barra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity=".9"/>
      <stop offset="1" stop-color="#C9D6F2" stop-opacity=".55"/>
    </linearGradient>
  </defs>
</svg>

<img class="logo" src="../marca/kovex-lockup-horizontal-dark.svg" alt="">
<h1>Sua ideia vira produto, camada por camada.</h1>
<p class="rodape"><span class="chevron"></span>Sistemas, apps e sites · <b>kovex.com.br</b></p>

<div class="vidro">
  <div class="pilha">
    <div class="placa" style="--i:3"><svg viewBox="0 0 104.75 130"><path class="corpo" d="M62.75 0 H104.75 L56 65 L104.75 130 H62.75 L14 65 Z"/></svg></div>
    <div class="placa" style="--i:2"><svg viewBox="0 0 104.75 130"><path class="corpo" d="M62.75 0 H104.75 L56 65 L104.75 130 H62.75 L14 65 Z"/></svg></div>
    <div class="placa" style="--i:1"><svg viewBox="0 0 104.75 130"><path class="corpo" d="M62.75 0 H104.75 L56 65 L104.75 130 H62.75 L14 65 Z"/></svg></div>
    <div class="placa barra" style="--i:0"><svg viewBox="0 0 104.75 130"><path class="corpo" d="M0 0 H35 V27 L6.5 65 L35 103 V130 H0 Z"/><path class="reflexo" d="M0 0 H35 V27 L6.5 65 L35 103 V130 H0 Z"/></svg></div>
    <div class="placa" style="--i:0"><svg viewBox="0 0 104.75 130"><path class="corpo" d="M62.75 0 H104.75 L56 65 L104.75 130 H62.75 L14 65 Z"/><path class="reflexo" d="M62.75 0 H104.75 L56 65 L104.75 130 H62.75 L14 65 Z"/></svg></div>
  </div>
</div>
</body>
</html>
