<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 136" width="452" height="512">
  <defs>
    <!-- Face frontal do braço (mesma da navy) -->
    <linearGradient id="kxn3-arm" gradientUnits="userSpaceOnUse" x1="113.75" y1="0" x2="44" y2="93">
      <stop offset="0" stop-color="#3E70E4"/>
      <stop offset="1" stop-color="#2247D2"/>
    </linearGradient>
    <!-- Lateral do braço: azul mais profundo, em sombra -->
    <linearGradient id="kxn3-armside" gradientUnits="userSpaceOnUse" x1="113.75" y1="0" x2="44" y2="93">
      <stop offset="0" stop-color="#1B3AA8"/>
      <stop offset="1" stop-color="#12235F"/>
    </linearGradient>
  </defs>

  <!-- ===== Faces laterais (extrusão 6,6) ===== -->
  <!-- Barra: lateral direita e base -->
  <path fill="#1E2F52" d="M35 0 L41 6 L41 136 L35 130 Z"/>
  <path fill="#141F38" d="M0 130 L6 136 L41 136 L35 130 Z"/>
  <!-- Perna: lateral direita e base -->
  <path fill="#1E2F52" d="M68.75 70 L74.75 76 L119.75 136 L113.75 130 Z"/>
  <path fill="#141F38" d="M71.75 130 L77.75 136 L119.75 136 L113.75 130 Z"/>
  <!-- Braço: lateral desce sobre o respiro, encostando na perna -->
  <path fill="url(#kxn3-armside)" d="M113.75 0 L119.75 6 L50 99 L44 93 Z"/>

  <!-- ===== Faces frontais ===== -->
  <path fill="#0A121D" d="M0 0 H35 V130 H0 Z"/>
  <path fill="#0A121D" d="M68.75 70 L113.75 130 H71.75 L47.75 98 Z"/>
  <path fill="url(#kxn3-arm)" d="M71.75 0 H113.75 L44 93 V37 Z"/>
</svg>
